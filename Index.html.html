    // Helper Image component with multi-candidate resilience
    function ResilientAssetImg({ filename, basePath = "./Assets/", alt, className = "", width, height }) {
      const [srcIndex, setSrcIndex] = useState(0);
      const cleanBase = basePath.endsWith('/') ? basePath : `${basePath}/`;
      const lowerBase = cleanBase.replace('./Assets/', './assets/');
      const nameWithoutExt = filename.replace(/\.(jpg|jpeg|png|webp|svg|gif|JPG|PNG|WEBP|JPEG)$/i, '');

      const candidates = [
        `${cleanBase}${filename}`,
        `${cleanBase}${nameWithoutExt}.jpg`,
        `${cleanBase}${nameWithoutExt}.JPG`,
        `${cleanBase}${nameWithoutExt}.png`,
        `${cleanBase}${nameWithoutExt}.PNG`,
        `${cleanBase}${nameWithoutExt}.webp`,
        `${cleanBase}${nameWithoutExt}.WEBP`,
        `${cleanBase}${nameWithoutExt}.jpeg`,
        `${lowerBase}${filename}`,
        `${lowerBase}${nameWithoutExt}.jpg`,
        `${lowerBase}${nameWithoutExt}.png`,
        `${cleanBase}Logo.png.jpg`
      ];

      return (
        <img
          src={candidates[srcIndex]}
          alt={alt}
          className={className}
          width={width}
          height={height}
          loading="lazy"
          onError={() => {
            if (srcIndex < candidates.length - 1) {
              setSrcIndex(srcIndex + 1);
            }
          }}
        />
      );
    }
