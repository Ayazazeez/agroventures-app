    // Helper Image Component with multi-relative fallback support
    function ResilientAssetImg({ filename, basePath = "./assets/", alt, className = "", width, height }) {
      const [srcIndex, setSrcIndex] = useState(0);
      const cleanBase = basePath.endsWith('/') ? basePath : basePath + '/';
      const upperBase = cleanBase.replace('./assets/', './Assets/');
      const nameWithoutExt = filename.replace(/\.(jpg|jpeg|png|webp|svg|gif|JPG|PNG|WEBP|JPEG)$/i, '');

      const candidates = [
        cleanBase + filename,
        upperBase + filename,
        './assets/' + filename,
        './Assets/' + filename,
        './assets/My Details/' + filename,
        './Assets/My Details/' + filename,
        './assets/Certifications/' + filename,
        './Assets/Certifications/' + filename,
        './assets/Company Vision/' + filename,
        './Assets/Company Vision/' + filename,
        cleanBase + nameWithoutExt + '.jpg',
        cleanBase + nameWithoutExt + '.png',
        upperBase + nameWithoutExt + '.jpg',
        upperBase + nameWithoutExt + '.png'
      ];

      return (
        <img
          src={candidates[srcIndex] || candidates[0]}
          alt={alt}
          className={className}
          width={width}
          height={height}
          loading="lazy"
          onError={() => {
            if (srcIndex < candidates.length - 1) {
              setSrcIndex(srcIndex + 1);
            }
          }}
        />
      );
    }
